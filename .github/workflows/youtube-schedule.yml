name: Nour Quran Auto Poster

on:
  schedule:
    - cron: '0 23,5,9,13,17,21 * * *' # 00:00, 06:00, 10:00, 14:00, 18:00, 22:00 Morocco time (UTC+1)
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Prepare Quranic font
        run: npm run prepare:font

      - name: Install FFmpeg and ffprobe
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Arabic text-to-speech
        run: sudo apt-get install -y espeak-ng

      - name: Install Chrome for Puppeteer and set BROWSER_EXECUTABLE_PATH
        run: |
          npx puppeteer@latest browsers install chrome
          CHROME_PATH=$(find ~/.cache/puppeteer -type f -name chrome -print -quit)
          if [ -z "$CHROME_PATH" ]; then
            echo "Could not find chrome executable under ~/.cache/puppeteer" >&2
            exit 1
          fi
          echo "BROWSER_EXECUTABLE_PATH=$CHROME_PATH" >> $GITHUB_ENV

      - name: Run Auto Poster
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
          FFPROBE_PATH: /usr/bin/ffprobe
          FONT_FILE: ${{ github.workspace }}/assets/fonts/Amiri-Regular.ttf
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: node runScheduledPost.js
