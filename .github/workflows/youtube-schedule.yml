name: Nour Quran Auto Poster

on:
  schedule:
    - cron: '0 5,12,15,21 * * *'  # 08:00, 15:00, 18:00, 00:00 Asia/Riyadh
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install FFmpeg and ffprobe
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Chrome for Puppeteer
        run: npx puppeteer browsers install chrome

      - name: Run Auto Poster
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
          BROWSER_EXECUTABLE_PATH: /home/runner/.cache/puppeteer/chrome/linux-*/chrome-linux64/chrome
          FFPROBE_PATH: /usr/bin/ffprobe
        run: node autoPoster.js
